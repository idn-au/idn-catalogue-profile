<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Overview of elements of the Local Context Model</title>
  <desc id="description">The preferred direct pattern links a catalogued resource directly to Traditional Knowledge and Biocultural Labels with odrl:hasPolicy and to Local Contexts Notices with schema:potentialAction. The diagram also shows Collections Care Notices and duties, common supporting properties, and the optional Qualified Local Context relationship.</desc>

